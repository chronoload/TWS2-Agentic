<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WYSIWYG 协同试验 · Vditor + Loro</title>
<link rel="stylesheet" href="/static/vditor/index.css">
<style>
  body { margin:0; font-family:system-ui,-apple-system,sans-serif; background:#0f1115; color:#e6e6e6; }
  #bar { display:flex; align-items:center; gap:12px; padding:8px 14px; border-bottom:1px solid #333; font-size:13px; background:#16181d; flex-wrap:wrap; }
  #bar button { background:#2b2f36; color:#e6e6e6; border:1px solid #444; border-radius:6px; padding:4px 10px; cursor:pointer; font-size:12px; }
  .net-dot { width:9px; height:9px; border-radius:50%; background:#22c55e; display:inline-block; }
  .net-dot.off { background:#ef4444; }
  .cols { display:flex; height:calc(100vh - 178px); }
  .col { flex:1; display:flex; flex-direction:column; min-width:0; border-right:1px solid #333; }
  .col:last-child { border-right:none; }
  .col-head { padding:6px 12px; font-size:12px; color:#aaa; border-bottom:1px solid #333; background:#16181d; }
  .col-head b { color:#7dd3fc; }
  .col-body { flex:1; overflow:hidden; }
  #log { height:120px; overflow:auto; border-top:1px solid #333; padding:6px 12px; font:12px/1.6 Consolas,Menlo,monospace; color:#9ca3af; background:#0b0d10; white-space:pre-wrap; word-break:break-all; }
  .lg-ok { color:#6ee7b7; } .lg-warn { color:#fcd34d; } .lg-err { color:#fca5a5; }
  .hint { margin-left:auto; color:#667; font-size:12px; }
  .vditor-ir { position: relative; }
  .vd-collab-cursor {
    position: absolute; z-index: 5; pointer-events: none;
    font-size: 10px; line-height: 14px; color: #fff;
    background: #f0abfc; border-radius: 3px; padding: 0 4px;
    transform: translateY(-100%); white-space: nowrap;
  }
  .vd-collab-cursor::after {
    content: ''; position: absolute; left: 0; top: 100%;
    border-left: 1px solid #f0abfc; height: 14px;
  }
</style>
</head>
<body>
<div id="bar">
  <span class="net-dot" id="netDot"></span>
  <span>WYSIWYG 虚拟网络 A ⇄ B</span>
  <span>update：<b id="updCount">0</b></span>
  <span>增量：<b id="incrementalCount">0</b></span>
  <span>fallback：<b id="fallbackCount">0</b></span>
  <span>IME 队列：<b id="imeCount">0</b></span>
  <button id="btnReset">重置</button>
  <button id="btnClearLog">清日志</button>
  <span class="hint">目标：不同位置同时敲击时，内容一致且本地光标不跳。</span>
</div>
<div class="cols">
  <div class="col"><div class="col-head">实例 <b>A</b> · WYSIWYG + Loro docA</div><div class="col-body"><div id="vdA"></div></div></div>
  <div class="col"><div class="col-head">实例 <b>B</b> · WYSIWYG + Loro docB</div><div class="col-body"><div id="vdB"></div></div></div>
</div>
<div id="log"></div>
<script src="/static/vditor/js/katex/katex.min.js"></script>
<script src="/static/vditor/index.min.js"></script>
<script src="/static/collab/collab-poc-ir-core.js"></script>
<script type="module" src="/static/collab/collab-poc-wysiwyg.js"></script>
</body>
</html>
