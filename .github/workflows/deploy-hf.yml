name: Deploy to Hugging Face Spaces

on:
  push:
    branches: [remote]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to HF Spaces
        uses: huggingface-space/publish-action@v0
        with:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE_ID: ${{ secrets.HF_SPACE_ID }}   # 形如 your-name/ts2
          SPACE_SDK: docker
